apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db01
  namespace: {{ .Values.namespace }}
  labels:
    app: db01
    tier: db
spec:
  serviceName: db01
  replicas: {{ .Values.db.replicaCount }}
  selector:
    matchLabels:
      app: db01
  template:
    metadata:
      labels:
        app: db01
        tier: db
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mysql-role"
        vault.hashicorp.com/agent-inject-secret-mysql.txt: "secret/data/mysql"
        vault.hashicorp.com/agent-inject-template-mysql.txt: |
          {{`{{- with secret "secret/data/mysql" -}}`}}
          export MYSQL_ROOT_PASSWORD={{`{{ .Data.data.root_password }}`}}
          {{`{{- end }}`}}
    spec:
      serviceAccountName: mysql-sa
      containers:
        - name: db01
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          command:
            - "/bin/sh"
            - "-c"
            - |
              until [ -f /vault/secrets/mysql.txt ]; do echo waiting for vault secret; sleep 2; done
              source /vault/secrets/mysql.txt
              exec docker-entrypoint.sh mysqld
          ports:
            - containerPort: {{ .Values.db.service.targetPort }}
          env:
            - name: MYSQL_DATABASE
              value: "{{ .Values.db.database }}"
          livenessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "source /vault/secrets/mysql.txt && mysqladmin ping -h localhost -p\"$MYSQL_ROOT_PASSWORD\""
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "source /vault/secrets/mysql.txt && mysqladmin ping -h localhost -p\"$MYSQL_ROOT_PASSWORD\""
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: "{{ .Values.db.persistence.storageClassName }}"
      resources:
        requests:
          storage: "{{ .Values.db.persistence.size }}"
---
apiVersion: v1
kind: Service
metadata:
  name: db01
  namespace: {{ .Values.namespace }}
  labels:
    app: db01
spec:
  clusterIP: None   # headless - required for StatefulSet stable network identity
  selector:
    app: db01
  ports:
    - port: {{ .Values.db.service.port }}
      targetPort: {{ .Values.db.service.targetPort }}